# Publishes the browser demo to GitHub Pages: https://ou1051.github.io/SnapSort/
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Demo on GitHub Pages

on:
  push:
    branches: [main, feature/snapsort-mvp]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Export the web demo
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_BASE_URL: /SnapSort
          CI: 1
      - name: Single-page fallback for deep links
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
